spring.application.name=ai-proxy-platform

# Railway injects PORT; locally it runs on 8080
server.port=${PORT:8080}

# Time zone used for daily history, reset dates and scheduled tasks
app.time-zone=${APP_TIME_ZONE:America/Bogota}

# Comma-separated list of allowed frontend origins (wildcards allowed)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}

spring.jackson.serialization.write-dates-as-timestamps=false
